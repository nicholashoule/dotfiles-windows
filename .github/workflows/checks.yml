name: Checks

# homeskillet does not run on Windows yet, so the checks run on Ubuntu, whose
# GitHub runner images include PowerShell (pwsh) and ShellCheck. ShellCheck lints
# the Bash tooling only here, since commits are made on Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: >-
          shellcheck scripts/*.sh tests/check.sh .githooks/pre-commit
          home/wsl/.bashrc home/wsl/.bash_profile home/wsl/.bash_logout home/wsl/.bashrc.d/*.sh
          home/wsl/.local/share/helpers/sh/*.sh

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-PSResource PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -TrustRepository -ErrorAction Stop
          }

      # The checker the hook runs, on every tracked PowerShell file. Any nonzero
      # status fails the step, including a missing pwsh or PSScriptAnalyzer,
      # which the regression checks only report as skipped.
      - name: PowerShell lint
        run: git ls-files -z '*.ps1' '*.psm1' '*.psd1' | xargs -0 bash scripts/check-powershell.sh

      - name: Regression checks
        run: bash tests/check.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same scan the pre-commit hook runs, over every tracked file, so a
      # commit made with --no-verify or without the hook still fails here.
      - name: Secret scan
        run: bash scripts/check-secrets.sh --all
