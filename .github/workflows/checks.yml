name: Checks

# The checks run on Ubuntu, whose GitHub runner images include PowerShell (pwsh)
# and ShellCheck, with homeskillet's Linux release acting for Windows and for
# WSL. ShellCheck lints the Bash tooling only here, since commits are made on
# Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: >-
          shellcheck scripts/*.sh tests/check.sh .githooks/pre-commit
          home/wsl/.bashrc home/wsl/.bash_profile home/wsl/.bash_logout home/wsl/.bashrc.d/*.sh
          home/wsl/.local/share/helpers/sh/*.sh

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-PSResource PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -TrustRepository -ErrorAction Stop
          }

      # The checker the hook runs, on every tracked PowerShell file. Any nonzero
      # status fails the step, including a missing pwsh or PSScriptAnalyzer,
      # which the regression checks only report as skipped.
      - name: PowerShell lint
        run: git ls-files -z '*.ps1' '*.psm1' '*.psd1' | xargs -0 bash scripts/check-powershell.sh

      # homeskillet's Linux release, run only once it matches the SHA-256 its
      # release's SHA256SUMS lists. Raise the version when homeskillet releases
      # a new one; the README names the oldest the checks support.
      - name: Download homeskillet
        env:
          HOMESKILLET_VERSION: v0.4.0
        run: |
          dir=$(mktemp -d)
          base="https://github.com/nicholashoule/homeskillet/releases/download/$HOMESKILLET_VERSION"
          curl -fsSL --proto '=https' -o "$dir/homeskillet-linux-amd64" "$base/homeskillet-linux-amd64"
          curl -fsSL --proto '=https' -o "$dir/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$dir" && grep ' homeskillet-linux-amd64$' SHA256SUMS | sha256sum --check --strict)
          chmod +x "$dir/homeskillet-linux-amd64"
          "$dir/homeskillet-linux-amd64" version
          echo "HOMESKILLET=$dir/homeskillet-linux-amd64" >>"$GITHUB_ENV"

      - name: Regression checks
        run: bash tests/check.sh "$HOMESKILLET"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same scan the pre-commit hook runs, over every tracked file, so a
      # commit made with --no-verify or without the hook still fails here.
      - name: Secret scan
        run: bash scripts/check-secrets.sh --all
