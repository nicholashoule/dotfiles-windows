name: Checks

# homeskillet does not run on Windows yet, so the checks run on Ubuntu, whose
# GitHub runner images include PowerShell (pwsh) and ShellCheck.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/check.sh .githooks/pre-commit

      - name: Regression checks
        run: bash tests/check.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same scan the pre-commit hook runs, over every tracked file, so a
      # commit made with --no-verify or without the hook still fails here.
      - name: Secret scan
        run: bash scripts/check-secrets.sh --all
